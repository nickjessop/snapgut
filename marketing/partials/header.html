<!-- Skip control and site header, shared by every Marketing_Page (Req 7.2).
     The skip link is the first focusable element and is moved off-screen rather
     than hidden, so it stays in the tab order and appears on focus (Req 10.1).
     Its target carries id="main" tabindex="-1" so focus lands there, not just
     the scroll position. header + nav are two of the four landmarks (Req 10.2).
     The brand mark is decorative, so alt is empty (Req 10.4); it has intrinsic
     dimensions and loads eagerly, being above the fold (Req 15.3). -->
<a class="skip-link" href="#main">Skip to main content</a>

<header class="site-header">
  <nav class="site-nav" aria-label="Main">
    <a class="brand" href="/">
      <img
        class="brand-mark"
        src="/icon-192.png"
        alt=""
        width="28"
        height="28"
        loading="eager"
        decoding="async"
      />
      <span class="brand-name">SnapGut</span>
    </a>

    <ul class="nav-links">
      <li><a href="/pricing">Pricing</a></li>
      <li><a href="/privacy">Privacy</a></li>
    </ul>

    <a class="btn btn-primary nav-cta" href="/login">Open the app</a>
  </nav>
</header>
