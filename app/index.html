<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#fdfcf6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      Deliberately NOT `black-translucent`, and this is the fix for the band below the
      tab bar that four CSS attempts could not touch.

      With `black-translucent`, an installed iPhone 16 reported: screen 852px, web view
      793px, safe-area top inset 59px. 852 − 59 = 793 exactly. iOS was placing the web
      view at y=0 so the status bar overlaid our content — the full-bleed that flag is
      for — while still sizing it as though the status bar had been reserved. The
      document filled its web view perfectly (the frame's bottom edge and the CSS
      viewport's bottom edge measured identical, with nothing uncovered), so there was
      never a CSS bug to find: the 59px simply was not ours to paint. The app paid the
      top inset twice, once as padding and once as dead strip.

      `viewport-fit=cover` stays. Between them iOS is now self-consistent — either the
      web view covers the screen and reports real insets, or it reserves the status bar
      and starts below it — and both of those are gapless. The cost is that content no
      longer runs under the status bar; going back to full-bleed there means finding a
      way to make iOS report a height that matches the view it gives you.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SnapGut" />
    <!-- The App_Shell is never indexable; the server sends X-Robots-Tag too. -->
    <meta name="robots" content="noindex" />
    <title>SnapGut</title>
    <!--
      Launch screen, inline on purpose.

      It has to paint before the stylesheet and the bundle arrive, so it cannot live
      in styles.css and cannot reference an image — either would be a request the
      splash is meant to cover. `style-src` allows 'unsafe-inline' (server/csp.js),
      while `script-src` does not, so this is a style block and not a script.

      The colour is the manifest's `background_color`, so a launch from an Android
      home screen goes from the platform splash to this one with no visible seam.

      The markup lives inside #root, so React removes it on first render — there is
      no teardown code and therefore nothing that can leave it stuck on screen.
    -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #2d5d4d;
      }
      #boot i {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.25);
        border-top-color: rgba(255, 255, 255, 0.9);
        animation: boot-spin 0.8s linear infinite;
      }
      /* Held back so a fast load shows nothing at all rather than a flash of
         spinner — the best launch is one where this is never seen. */
      @media (prefers-reduced-motion: no-preference) {
        #boot i {
          animation-delay: 0.25s;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot i {
          animation: none;
        }
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot" role="status" aria-label="Loading SnapGut"><i></i></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
