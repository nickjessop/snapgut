services:
  snapgut:
    # Builds from this checkout. This is the default on purpose: `docker compose
    # up` from a fresh clone must run *this* working tree, which is what the
    # README quickstart promises and what the CI docker job exercises.
    build: .
    #
    # To run the published multi-arch image instead of building, comment out
    # `build: .` above and uncomment one of these:
    #
    #   image: ghcr.io/nickjessop/snap-gut:latest   # newest release
    #   image: ghcr.io/nickjessop/snap-gut:0.1      # newest 0.1.x patch
    #   image: ghcr.io/nickjessop/snap-gut:0.1.0    # pinned exactly
    #
    # Why a commented line rather than setting `image:` and `build:` together:
    # with both set, Compose resolves the image first and only builds when it
    # cannot be obtained. Once the image exists on GHCR, `docker compose up` in a
    # fresh clone would silently run the *published* release instead of the code
    # in front of you — so a contributor testing a change could be running
    # someone else's build without being told. Trading one commented line of
    # operator setup for that ambiguity is not worth it. Nothing here is
    # mutually exclusive with the image path; it is just explicit about which one
    # you are on.
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    volumes:
      - ./data:/data
    env_file: .env
    environment:
      - BIND_HOST=0.0.0.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # The X-Forwarded-Proto header is required, not decoration. With
      # REQUIRE_HTTPS=1 the global guard in server/app.js derives the request
      # scheme from that header alone and answers 403 https_required to anything
      # else — so without it this check fails and the container is reported
      # unhealthy while the app is serving normally.
      #
      # Sending it here is safe because the request originates inside the
      # container against its own loopback interface, never from a client, so it
      # cannot be used to bypass the guard. With REQUIRE_HTTPS unset the header is
      # simply ignored, which is why one command covers both configurations.
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/api/health', { headers: { 'X-Forwarded-Proto': 'https' } }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
