services:
  snapgut:
    build: .
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    volumes:
      - ./data:/data
    env_file: .env
    environment:
      - BIND_HOST=0.0.0.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
